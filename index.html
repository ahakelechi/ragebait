<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RAGE QUEST: The Kind Kingdom</title>
<meta name="description" content="A tiny 16-bit-style browser rage-platformer built with HTML5 Canvas. It lies to you. Constantly.">
<meta name="theme-color" content="#0d0221">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">

<meta property="og:type" content="website">
<meta property="og:title" content="RAGE QUEST: The Kind Kingdom">
<meta property="og:description" content="A tiny 16-bit-style browser rage-platformer. Fake platforms, invisible spikes, a fake victory flag - it lies to you, constantly.">
<meta property="og:image" content="og-image.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="RAGE QUEST: The Kind Kingdom">
<meta name="twitter:description" content="A tiny 16-bit-style browser rage-platformer. It lies to you, constantly.">
<meta name="twitter:image" content="og-image.svg">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <div id="title">RAGE QUEST</div>
  <div id="subtitle">— THE KIND KINGDOM (it lies) —</div>
  <div id="gameRow">
    <div id="frame">
      <div id="hud">
        <span id="attempts"><img class="icon16" src="icon-skull.svg" alt=""><span id="attemptsText">ATTEMPT: 1</span></span>
        <span id="levelIndicator">LEVEL: 1/2</span>
        <span id="checkpoint" aria-live="polite"><img class="icon16" src="icon-flag.svg" alt=""><span id="checkpointText">CHECKPOINT: START</span></span>
        <span id="timer">TIME: 0.0s</span>
      </div>
      <div style="position:relative;">
        <canvas id="game" width="480" height="270"></canvas>
        <div id="banner" role="status" aria-live="polite"></div>
      </div>
    </div>
    <div id="liveBoard"></div>
  </div>
  <div id="settingsPanel" role="dialog" aria-label="Settings"></div>
  <div id="controls">ARROW KEYS / A-D TO MOVE · SPACE OR UP TO JUMP · HOLD SHIFT TO SPRINT · R TO RESTART LEVEL</div>
  <div id="linkRow">
    <button id="boardLink" class="rq-link" type="button">VIEW LEADERBOARD</button>
    <button id="liveBoardToggle" class="rq-link" type="button">LIVE BOARD</button>
    <button id="pauseLink" class="rq-link" type="button"><img class="icon16" src="icon-pause.svg" alt="">PAUSE</button>
    <button id="settingsLink" class="rq-link" type="button" aria-label="Settings"><img class="icon16" src="icon-gear.svg" alt="">SETTINGS</button>
    <button id="shareLink" class="rq-link" type="button" style="display:none;">📤 SHARE</button>
  </div>
  <div id="touchControls">
    <div class="tc-row">
      <button id="btnLeft" class="tcbtn" type="button" aria-label="Move left">◀</button>
      <button id="btnRight" class="tcbtn" type="button" aria-label="Move right">▶</button>
    </div>
    <div class="tc-row">
      <button id="btnSprint" class="tcbtn" type="button" aria-label="Sprint">⚡</button>
      <button id="btnJump" class="tcbtn" type="button" aria-label="Jump">⬆</button>
      <button id="btnRestart" class="tcbtn" type="button" aria-label="Restart level">⟲</button>
    </div>
  </div>
</div>

<script src="settings.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
