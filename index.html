<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RAGE QUEST: The Kind Kingdom</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <div id="title">RAGE QUEST</div>
  <div id="subtitle">— THE KIND KINGDOM (it lies) —</div>
  <div id="gameRow">
    <div id="frame">
      <div id="hud">
        <span id="attempts">ATTEMPT: 1</span>
        <span id="levelIndicator">LEVEL: 1/2</span>
        <span id="checkpoint">CHECKPOINT: START</span>
        <span id="timer">TIME: 0.0s</span>
      </div>
      <div style="position:relative;">
        <canvas id="game" width="480" height="270"></canvas>
        <div id="banner"></div>
      </div>
    </div>
    <div id="liveBoard"></div>
  </div>
  <div id="settingsPanel"></div>
  <div id="controls">ARROW KEYS / A-D TO MOVE · SPACE OR UP TO JUMP · HOLD SHIFT TO SPRINT · R TO RESTART LEVEL</div>
  <div id="linkRow">
    <button id="boardLink" class="rq-link" type="button">VIEW LEADERBOARD</button>
    <button id="liveBoardToggle" class="rq-link" type="button">LIVE BOARD</button>
    <button id="settingsLink" class="rq-link" type="button">⚙ SETTINGS</button>
  </div>
  <div id="touchControls">
    <div class="tc-row">
      <button id="btnLeft" class="tcbtn" type="button">◀</button>
      <button id="btnRight" class="tcbtn" type="button">▶</button>
    </div>
    <div class="tc-row">
      <button id="btnSprint" class="tcbtn" type="button">⚡</button>
      <button id="btnJump" class="tcbtn" type="button">⬆</button>
      <button id="btnRestart" class="tcbtn" type="button">⟲</button>
    </div>
  </div>
</div>

<script src="settings.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, getCountFromServer, query, orderBy, limit, where, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQt0Le1HCyLmwz5cAizDyyzFE3jKYEXB0",
  authDomain: "ragebait-high-scores.firebaseapp.com",
  projectId: "ragebait-high-scores",
  storageBucket: "ragebait-high-scores.firebasestorage.app",
  messagingSenderId: "899908365454",
  appId: "1:899908365454:web:54ead3f26d456e79e1eddf",
  measurementId: "G-98ZM3XGR14"
};

function collectionForDifficulty(difficulty) {
  const d = ['easy', 'mild', 'hard'].includes(difficulty) ? difficulty : 'mild';
  return 'scores_' + d;
}

try {
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.__scores = {
    async submit(name, time, attempts, difficulty) {
      await addDoc(collection(db, collectionForDifficulty(difficulty)), { name, time, attempts, ts: serverTimestamp() });
    },
    async top10(difficulty) {
      const q = query(collection(db, collectionForDifficulty(difficulty)), orderBy('time', 'asc'), limit(10));
      const snap = await getDocs(q);
      return snap.docs.map(d => d.data());
    },
    async rank(time, difficulty) {
      const q = query(collection(db, collectionForDifficulty(difficulty)), where('time', '<', time));
      const snap = await getCountFromServer(q);
      return snap.data().count + 1;
    }
  };
} catch (e) {
  console.warn('Firebase init failed, leaderboard disabled.', e);
}
</script>
</body>
</html>
